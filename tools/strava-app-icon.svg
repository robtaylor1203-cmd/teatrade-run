<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    TeaTrade Run — Strava API app icon
    256×256 square, safe for any background. The blue→orange ring
    nods to the site's accent palette; the running footprint sits
    inside a tea-cup silhouette for the "running for tea" idea.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#f56600"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="44" fill="#ffffff"/>
  <rect x="6" y="6" width="244" height="244" rx="38" fill="none"
        stroke="url(#ring)" stroke-width="6"/>

  <!-- Tea cup silhouette -->
  <g fill="none" stroke="#202124" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Cup body -->
    <path d="M58 110 H170 V158 a40 40 0 0 1 -40 40 H98 a40 40 0 0 1 -40 -40 Z"/>
    <!-- Handle -->
    <path d="M170 122 h16 a22 22 0 0 1 0 44 h-16"/>
    <!-- Saucer -->
    <path d="M44 210 H184" stroke-width="9"/>
    <!-- Steam -->
    <path d="M88 64 c0 10 10 10 10 20 s-10 10 -10 20" stroke-width="7"/>
    <path d="M118 56 c0 10 10 10 10 20 s-10 10 -10 20" stroke-width="7"/>
    <path d="M148 64 c0 10 10 10 10 20 s-10 10 -10 20" stroke-width="7"/>
  </g>

  <!-- Running figure inside the cup -->
  <g fill="#f56600">
    <!-- Head -->
    <circle cx="128" cy="132" r="9"/>
    <!-- Body / arms / legs as a stylised stride -->
    <path d="
      M128 145
      l 8 14
      l 12 -2
      M128 145
      l -10 12
      l -12 -4
      M132 159
      l 6 18
      l 10 0
      M124 159
      l -6 18
      l -10 -2
    " stroke="#f56600" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Accent dot — finish line -->
  <circle cx="200" cy="184" r="6" fill="#1a73e8"/>
</svg>
