name: Poll sponsorships

# Pings /api/sponsorships on a schedule so reconciliation (and the donor
# confirmation emails) run even when nobody is viewing the page. GiveWheel
# donations get matched to pending pixels, or recorded as orphans, within a
# few minutes instead of waiting for the next visitor.
#
# GitHub Actions minimum cron interval is 5 minutes.
# This repo is public, so the log shows public fields only. Orphans and
# diagnostics need the admin secret and are viewed on /admin/ instead.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit /api/sponsorships
        run: |
          set -u
          # -s silent, -S still show errors, NOT -f so we don't exit
          # 22 on a transient 5xx — we want to log it and move on.
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
            https://run.teatrade.co.uk/api/sponsorships || echo "000")
          echo "HTTP $HTTP"
          python3 -c "
          import json, sys
          try:
            d = json.load(open('/tmp/resp.json'))
          except Exception as e:
            print('non-json response:', e)
            sys.exit(0)
          print(json.dumps({
            'raised_total': d.get('raised_total'),
            'sponsored_miles': len(d.get('sponsorships', [])),
            'reserved_miles': d.get('pending_pixels'),
          }, indent=2))
          " || true
          # Only fail the job on a 5xx (real outage). 4xx is logged
          # so we can act, but doesn't cause noisy red runs.
          case "$HTTP" in
            5*|000) exit 1 ;;
          esac

      - name: Nudge the gear auction
        run: |
          # Lets the auction close, send results and send reminders on time even
          # when nobody is visiting the site. Public, read-only, returns no bids.
          curl -sS -o /dev/null -w 'auction HTTP %{http_code}\n' --max-time 30 \
            https://run.teatrade.co.uk/api/auction || true
