name: Poll sponsorships

# Pings /api/sponsorships on a schedule so reconciliation runs
# even when nobody is viewing the page. GiveWheel donations get
# matched to pending pixels (or recorded as orphans) within a few
# minutes of being made, instead of waiting for the next visitor.
#
# GitHub Actions minimum cron interval is 5 minutes.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit /api/sponsorships
        run: |
          set -u
          # -s silent, -S still show errors, NOT -f so we don't exit
          # 22 on a transient 5xx — we want to log it and move on.
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
            https://run.teatrade.co.uk/api/sponsorships || echo "000")
          echo "HTTP $HTTP"
          echo "---- response (truncated) ----"
          head -c 4000 /tmp/resp.json || true
          echo
          echo "---- diag ----"
          python3 -c "
          import json, sys
          try:
            d = json.load(open('/tmp/resp.json'))
          except Exception as e:
            print('non-json response:', e)
            sys.exit(0)
          print(json.dumps({
            'raised_total': d.get('raised_total'),
            'pending':      d.get('pending_pixels'),
            'orphans':      len(d.get('orphan_donations', [])),
            '_diag':        d.get('_diag'),
          }, indent=2))
          " || true
          # Only fail the job on a 5xx (real outage). 4xx is logged
          # so we can act, but doesn't cause noisy red runs.
          case "$HTTP" in
            5*|000) exit 1 ;;
          esac
